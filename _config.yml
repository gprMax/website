# ==========================================================================
# gprMax website — Jekyll configuration
#
# Values here exist so the same string is not repeated across six pages.
# When the .org cutover happens, `url` is the single edit (plus a CNAME).
# ==========================================================================

title: "gprMax"
author: "Craig Warren"
description: >-
  gprMax is open source software that solves Maxwell's equations using the
  Finite-Difference Time-Domain (FDTD) method. A general-purpose research
  platform for time-domain computational electromagnetics, it is used for
  Ground Penetrating Radar (GPR), antenna and microwave modelling, scattering
  and radar cross section, bioelectromagnetics and dosimetry, and radiometry

# Canonical tags are built from this. Change once at the .org cutover.
# The v4.0.0 announcement and its news entry publish themselves on this
# date. The site is going live before the code, so until then neither
# appears. Keep it in step with the date in _data/announcements.yml.
v4_release_date: 2026-08-31

url: "https://www.gprmax.com"
baseurl: ""

# Referenced ~25 times across pages and includes; Read the Docs moves separately.
docs_url: "https://docs.gprmax.com"
repo_url: "https://github.com/gprMax/gprMax"
discussions_url: "https://github.com/gprMax/gprMax/discussions"
releases_url: "https://github.com/gprMax/gprMax/releases"
# Base for deep links into a specific docs build. `latest` currently serves
# the v3 docs, whose page names differ from v4 (include_readme vs inc_README,
# input vs input_api, user_libs_* vs inc_*), so every v4 deep link 404s there.
# RELEASE CHECKLIST: flip this to .../en/latest once v4 is merged to master
# and Read the Docs has rebuilt `latest`.
docs_version_url: "https://docs.gprmax.com/en/devel"
install_url: "https://docs.gprmax.com/en/devel/inc_README.html#installation"
gtm_id: "GTM-WML3C9"

# Byte-identical in six pages before the migration.
keywords: "gprmax, gprmax3d, gprmax2d, ground penetrating radar, gpr, fdtd, electromagnetic, finite difference, time domain, solver, modelling, simulation, computational electromagnetics, antennas, microwave, S-parameters, radar cross section, RCS, scattering, bioelectromagnetics, dosimetry, SAR, radiometry, landmines, detection, engineering, civil, concrete, open source, NVIDIA, CUDA, OpenCL, Apple Metal, parallel, OpenMP, MPI, machine learning, full waveform inversion, neural networks"

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

exclude:
  - offline/
  - scripts/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - README.md
  - .htaccess
  - users/.htaccess
  - users/submit_pin.php
  # The full pins archive: names, Padlet permalinks, emails in note text.
  # Gitignored, so it cannot reach the Pages runner — this is the second
  # lock, for anyone building locally. users/pins.geojson, the minimised
  # file, IS published; that is what the map fetches.
  - users/pins.source.geojson
  - worker/
  # scopus.bib IS published — js/gprMaxBib.js fetches it at runtime.
  # Only the dated snapshots and test fixtures are excluded.
  - scopus-1.bib
  - scopus-old.bib
  - scopus_test.bib
  - scopus_previous.bib

# .shtml is not in Jekyll's default keep_files/HTML set; make sure it is
# treated as a page type that gets Liquid-processed (front matter does this)
# and served with the right type by the host.
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
      sidebar: true
      gtm: false
      mathjax: false
