# ==========================================================================
# gprMax website — Jekyll configuration
#
# Values here exist so the same string is not repeated across six pages.
# When the .org cutover happens, `url` is the single edit (plus a CNAME).
# ==========================================================================

title: "gprMax"
author: "Craig Warren"
description: >-
  gprMax is open-source software that solves Maxwell's equations using the
  finite-difference time-domain (FDTD) method. It began in ground-penetrating
  radar research and is now a general-purpose research platform for
  time-domain computational electromagnetics, used for GPR, antenna and
  microwave modelling, scattering and radar cross section, bioelectromagnetics
  and dosimetry, and radiometry.

# Canonical tags, the sitemap and every absolute_url are built from this.
# gprmax.com now forwards here rather than the other way round.
url: "https://gprmax.org"
baseurl: ""

# Referenced ~25 times across pages and includes; Read the Docs moves separately.
docs_url: "https://docs.gprmax.com"
repo_url: "https://github.com/gprMax/gprMax"
discussions_url: "https://github.com/gprMax/gprMax/discussions"
releases_url: "https://github.com/gprMax/gprMax/releases"
youtube_url: "https://www.youtube.com/@Gprmax"
# Base for deep links into a specific docs build. `latest` has served the v4
# docs since v4.0.0 was released (15-Sep-2026); the v3 docs, whose page names
# differ (include_readme vs inc_README, input vs input_api, user_libs_* vs
# inc_*), are no longer the default build.
docs_version_url: "https://docs.gprmax.com/en/latest"
install_url: "https://docs.gprmax.com/en/latest/inc_README.html#installation"
gtm_id: "GTM-WML3C9"

# Byte-identical in six pages before the migration.
keywords: "gprmax, gprmax3d, gprmax2d, ground penetrating radar, gpr, fdtd, electromagnetic, finite difference, time domain, solver, modelling, simulation, computational electromagnetics, antennas, microwave, S-parameters, radar cross section, RCS, scattering, bioelectromagnetics, dosimetry, SAR, radiometry, landmines, detection, engineering, civil, concrete, open source, NVIDIA, CUDA, OpenCL, Apple Metal, parallel, OpenMP, MPI, machine learning, full waveform inversion, neural networks"

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - README.md
  # The full pins archive: names, Padlet permalinks, emails in note text.
  # Gitignored, so it cannot reach the Pages runner — this is the second
  # lock, for anyone building locally. users/pins.geojson, the minimised
  # file, IS published; that is what the map fetches.
  - users/pins.source.geojson
  - worker/
  # scopus.bib IS published — js/gprMaxBib.js fetches it at runtime.
  # Only the dated snapshots and test fixtures are excluded.
  - scopus-1.bib
  - scopus-old.bib
  - scopus_test.bib
  - scopus_previous.bib

# Page flags, read by _layouts/default.html. A page overrides one in its
# front matter (usermap.shtml turns on `markercluster`; the redirect stub
# sets `layout: null`).
#   gtm            Google Tag Manager snippet
#   leaflet        Leaflet CSS/JS -- needed wherever the sidebar's map is
#   markercluster  MarkerCluster + css/usermap.css + js/usermap.js
#   bib            DataTables, Chart.js and js/gprMaxBib.js
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
      gtm: true
      leaflet: true
