name: Build and deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cut off a publish that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # needed for the scopus.bib commit date below

      # Replaces the Apache SSI <!--#flastmod virtual="scopus.bib" -->
      - name: Stamp bibliography date
        run: |
          mkdir -p _data
          printf 'updated: "%s"\n' \
            "$(git log -1 --format=%cd --date=format:'%d-%m-%Y' -- scopus.bib)" \
            > _data/bib.yml
          cat _data/bib.yml

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/configure-pages@v5
        id: pages
        with:
          # Turns Pages on (Source = GitHub Actions) if it is not already.
          # Without this the first run 404s: the API has no Pages site to
          # describe until one exists.
          enablement: true

      - name: Build
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
